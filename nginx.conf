events {}

http {
    ssl_certificate /etc/nginx/certs/certificat.crt;
    ssl_certificate_key /etc/nginx/certs/certificat.decrypted.key;

    server {
        listen 80;
        server_name auth.esioc.local grafana.esioc.local;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name grafana.esioc.local;

        location / {
            proxy_pass http://10.1.3.10:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name auth.esioc.local;

        location / {
            proxy_pass http://10.1.2.10:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}