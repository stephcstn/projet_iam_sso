services:
  postgres:
    image: postgres:19-alpine
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_postgre_iam
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      vlan-db:
        ipv4_address: 10.1.1.10

  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.8.2
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/db_postgre_iam
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
    networks:
      vlan-iam:
        ipv4_address: 10.1.2.10
      vlan-db:
        ipv4_address: 10.1.1.20
    depends_on:
      - postgres

  grafana:
    image: grafana/grafana:13.2.6
    container_name: grafana
    restart: always
    environment:
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak-OAuth
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile roles
      - GF_SERVER_ROOT_URL=https://grafana.esioc.local
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.esioc.local/realms/esioc/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak:8080/realms/esioc/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://keycloak:8080/realms/esioc/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'grafana-admin') && 'Admin' || contains(roles[*], 'grafana-editor') && 'Editor' || 'Viewer'
    depends_on:
      - keycloak
    networks:
      vlan-grafana:
        ipv4_address: 10.1.3.10
      vlan-iam:
        ipv4_address: 10.1.2.20
    
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    depends_on:
      - keycloak
      - grafana
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    networks:
      vlan-iam:
        ipv4_address: 10.1.2.30
      vlan-grafana:
        ipv4_address: 10.1.3.20
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  pg_data:

networks:
  vlan-db:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.1.1.0/24
  vlan-iam:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.2.0/24
  vlan-grafana:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.3.0/24